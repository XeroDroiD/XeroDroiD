<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020617"/><stop offset=".5" stop-color="#07111f"/><stop offset="1" stop-color="#020617"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7DB7FF"><animate attributeName="stop-color" values="#7DB7FF;#2ECC71;#FFB347;#7DB7FF" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset=".5" stop-color="#2ECC71"><animate attributeName="stop-color" values="#2ECC71;#FFB347;#7DB7FF;#2ECC71" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#FFB347"><animate attributeName="stop-color" values="#FFB347;#7DB7FF;#2ECC71;#FFB347" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
    <path d="M38 0H0V38" fill="none" stroke="#7DB7FF" stroke-opacity=".065"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="420" rx="30" fill="url(#bg)"/>
<rect x="18" y="18" width="1164" height="384" rx="26" fill="url(#grid)" stroke="url(#neon)" stroke-width="1.5"/>
<circle cx="130" cy="75" r="220" fill="#7DB7FF" opacity=".10"><animate attributeName="cx" values="130;350;130" dur="10s" repeatCount="indefinite"/></circle>
<circle cx="1070" cy="340" r="250" fill="#2ECC71" opacity=".07"><animate attributeName="cx" values="1070;860;1070" dur="11s" repeatCount="indefinite"/></circle>

<g font-family="Segoe UI,Arial,sans-serif">
  <circle cx="62" cy="58" r="6" fill="#FF4D4D"/><circle cx="84" cy="58" r="6" fill="#FFB347"/><circle cx="106" cy="58" r="6" fill="#2ECC71"/>
  <text x="138" y="64" fill="#64748B" font-size="14" letter-spacing="2">~/profile/xerodroid</text>

  <text x="66" y="126" fill="#94A3B8" font-family="Consolas,monospace" font-size="17">$ ./profile --boot</text>
  <circle cx="260" cy="120" r="5" fill="#2ECC71"><animate attributeName="opacity" values="1;.15;1" dur="1.1s" repeatCount="indefinite"/></circle>

  <text x="62" y="232" fill="url(#neon)" filter="url(#glow)" font-size="86" font-weight="800" letter-spacing="5">XERODROID</text>
  <text x="66" y="276" fill="#E2E8F0" font-size="18" font-weight="600" letter-spacing="5">DEVELOPER • INFRA • MINECRAFT • WEB</text>

  <rect x="66" y="315" width="196" height="36" rx="18" fill="#7DB7FF" fill-opacity=".10" stroke="#7DB7FF" stroke-opacity=".65"/>
  <circle cx="85" cy="333" r="4" fill="#2ECC71"><animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"/></circle>
  <text x="99" y="338" fill="#BFDBFE" font-size="13" font-weight="700">SYSTEM ONLINE</text>

  <rect x="278" y="315" width="210" height="36" rx="18" fill="#FFB347" fill-opacity=".08" stroke="#FFB347" stroke-opacity=".55"/>
  <text x="299" y="338" fill="#FED7AA" font-size="13" font-weight="700">BUILD • LEARN • SHIP</text>
</g>

<rect x="0" y="0" width="1200" height="2" fill="url(#neon)" opacity="0">
  <animate attributeName="y" values="25;395;25" dur="5.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;.8;0" dur="5.5s" repeatCount="indefinite"/>
</rect>
</svg>