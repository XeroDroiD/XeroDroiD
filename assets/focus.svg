<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="XeroLe1er areas of expertise">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#38BDF8"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#00E0A1"/>
    </linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="350" rx="22" fill="#030712"/>
  <text x="45" y="57" font-family="Segoe UI,Arial" font-size="16" font-weight="700" letter-spacing="3" fill="#94A3B8">CORE MODULES</text>
  <rect x="45" y="76" width="1110" height="2" fill="url(#line)" opacity=".7"/>

  <g font-family="Segoe UI,Arial">
    <g transform="translate(45 110)">
      <rect width="255" height="190" rx="18" fill="#07111F" stroke="#38BDF8" stroke-opacity=".55"/>
      <circle cx="31" cy="33" r="9" fill="#38BDF8" opacity=".85"><animate attributeName="r" values="7;10;7" dur="2.7s" repeatCount="indefinite"/></circle>
      <text x="52" y="40" fill="#E0F2FE" font-size="20" font-weight="750">DEVELOPMENT</text>
      <text x="25" y="83" fill="#94A3B8" font-size="14">Java • JavaScript • TypeScript</text>
      <text x="25" y="111" fill="#94A3B8" font-size="14">Node.js • React • APIs</text>
      <text x="25" y="139" fill="#94A3B8" font-size="14">architecture • tooling</text>
      <text x="25" y="168" fill="#7DD3FC" font-size="12" font-weight="700">BUILD / TEST / SHIP</text>
    </g>

    <g transform="translate(330 110)">
      <rect width="255" height="190" rx="18" fill="#0B0A1A" stroke="#8B5CF6" stroke-opacity=".58"/>
      <circle cx="31" cy="33" r="9" fill="#8B5CF6" opacity=".9"><animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/></circle>
      <text x="52" y="40" fill="#EDE9FE" font-size="20" font-weight="750">INFRA</text>
      <text x="25" y="83" fill="#94A3B8" font-size="14">Linux • Docker • Nginx</text>
      <text x="25" y="111" fill="#94A3B8" font-size="14">MongoDB • Redis • VPN</text>
      <text x="25" y="139" fill="#94A3B8" font-size="14">Proxmox • DNS • monitoring</text>
      <text x="25" y="168" fill="#C4B5FD" font-size="12" font-weight="700">DEPLOY / SECURE / SCALE</text>
    </g>

    <g transform="translate(615 110)">
      <rect width="255" height="190" rx="18" fill="#051712" stroke="#00E0A1" stroke-opacity=".5"/>
      <circle cx="31" cy="33" r="9" fill="#00E0A1" opacity=".86"><animate attributeName="r" values="9;6;9" dur="2.6s" repeatCount="indefinite"/></circle>
      <text x="52" y="40" fill="#D1FAE5" font-size="20" font-weight="750">MINECRAFT</text>
      <text x="25" y="83" fill="#94A3B8" font-size="14">Paper • Purpur • Velocity</text>
      <text x="25" y="111" fill="#94A3B8" font-size="14">plugins • custom systems</text>
      <text x="25" y="139" fill="#94A3B8" font-size="14">ItemsAdder • networks</text>
      <text x="25" y="168" fill="#6EE7B7" font-size="12" font-weight="700">DESIGN / CODE / OPTIMIZE</text>
    </g>

    <g transform="translate(900 110)">
      <rect width="255" height="190" rx="18" fill="#0A111C" stroke="#F59E0B" stroke-opacity=".46"/>
      <circle cx="31" cy="33" r="9" fill="#F59E0B" opacity=".86"><animate attributeName="opacity" values="1;.35;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <text x="52" y="40" fill="#FEF3C7" font-size="20" font-weight="750">PRODUCT</text>
      <text x="25" y="83" fill="#94A3B8" font-size="14">Findzy • web platforms</text>
      <text x="25" y="111" fill="#94A3B8" font-size="14">hosting • automation</text>
      <text x="25" y="139" fill="#94A3B8" font-size="14">UX • operations • support</text>
      <text x="25" y="168" fill="#FCD34D" font-size="12" font-weight="700">IDEA / PRODUCT / OPERATE</text>
    </g>
  </g>
</svg>