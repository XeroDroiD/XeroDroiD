<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="XeroLe1er developer profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#7C3AED;#00E0A1;#38BDF8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#00E0A1;#38BDF8;#7C3AED" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00E0A1">
        <animate attributeName="stop-color" values="#00E0A1;#38BDF8;#7C3AED;#00E0A1" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset=".45" stop-color="#38BDF8" stop-opacity=".7"/>
      <stop offset=".55" stop-color="#00E0A1" stop-opacity=".7"/>
      <stop offset="1" stop-color="#00E0A1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blue">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#60A5FA" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="clip"><rect x="18" y="18" width="1164" height="434" rx="28"/></clipPath>
  </defs>

  <rect width="1200" height="470" rx="30" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect x="18" y="18" width="1164" height="434" fill="url(#grid)"/>

    <circle cx="130" cy="78" r="285" fill="url(#blue)" filter="url(#soft)">
      <animate attributeName="cx" values="130;390;130" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="78;165;78" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1070" cy="380" r="300" fill="url(#purple)" filter="url(#soft)">
      <animate attributeName="cx" values="1070;835;1070" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="380;270;380" dur="10s" repeatCount="indefinite"/>
    </circle>

    <rect x="45" y="45" width="1110" height="374" rx="22" fill="#020617" fill-opacity=".38" stroke="#334155" stroke-opacity=".6"/>

    <g font-family="Segoe UI,Arial,sans-serif">
      <circle cx="76" cy="75" r="6" fill="#FF5F57"/>
      <circle cx="99" cy="75" r="6" fill="#FEBC2E"/>
      <circle cx="122" cy="75" r="6" fill="#28C840"/>
      <text x="158" y="81" fill="#64748B" font-size="14" letter-spacing="2">ssh://github.com/XeroDroiD</text>

      <text x="74" y="144" fill="#94A3B8" font-family="Consolas,Menlo,monospace" font-size="17">$ whoami</text>
      <text x="74" y="257" fill="url(#neon)" filter="url(#glow)" font-size="88" font-weight="800" letter-spacing="3">XeroLe1er</text>
      <text x="78" y="300" fill="#E2E8F0" font-size="18" font-weight="650" letter-spacing="5">DEVELOPER • INFRASTRUCTURE • MINECRAFT • WEB</text>

      <g transform="translate(77 335)">
        <rect width="188" height="38" rx="19" fill="#38BDF8" fill-opacity=".1" stroke="#38BDF8" stroke-opacity=".68"/>
        <circle cx="19" cy="19" r="4" fill="#00E0A1">
          <animate attributeName="opacity" values="1;.2;1" dur="1.15s" repeatCount="indefinite"/>
        </circle>
        <text x="34" y="24" fill="#BAE6FD" font-size="13" font-weight="700" letter-spacing="1">SYSTEM ONLINE</text>
      </g>

      <g transform="translate(281 335)">
        <rect width="218" height="38" rx="19" fill="#7C3AED" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".55"/>
        <text x="20" y="24" fill="#DDD6FE" font-size="13" font-weight="700" letter-spacing="1">BUILD • SHIP • IMPROVE</text>
      </g>

      <g transform="translate(516 335)">
        <rect width="194" height="38" rx="19" fill="#00E0A1" fill-opacity=".08" stroke="#00E0A1" stroke-opacity=".55"/>
        <text x="21" y="24" fill="#A7F3D0" font-size="13" font-weight="700" letter-spacing="1">@XeroDroiD</text>
      </g>
    </g>

    <g opacity=".72">
      <circle cx="1050" cy="105" r="2.2" fill="#38BDF8"><animate attributeName="opacity" values=".15;1;.15" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="162" r="1.8" fill="#00E0A1"><animate attributeName="opacity" values="1;.1;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="983" cy="350" r="2.4" fill="#A78BFA"><animate attributeName="opacity" values=".1;1;.1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="193" cy="389" r="2" fill="#38BDF8"><animate attributeName="opacity" values="1;.12;1" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="-280" y="36" width="280" height="2.5" fill="url(#scan)" opacity=".8">
      <animate attributeName="x" values="-280;1200" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="1200" height="2" fill="url(#neon)" opacity="0">
      <animate attributeName="y" values="38;430;38" dur="6.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.5;0" dur="6.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="18" y="18" width="1164" height="434" rx="28" fill="none" stroke="url(#neon)" stroke-opacity=".68" stroke-width="1.5"/>
</svg>