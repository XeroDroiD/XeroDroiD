<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="XeroLe1er terminal profile">
  <defs>
    <linearGradient id="border" x1="0" x2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#00E0A1"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="328" rx="22" fill="#050B16" stroke="url(#border)" stroke-opacity=".55"/>
  <rect x="22" y="22" width="1156" height="286" rx="15" fill="#020617" stroke="#1E293B"/>
  <circle cx="48" cy="48" r="6" fill="#FF5F57"/><circle cx="70" cy="48" r="6" fill="#FEBC2E"/><circle cx="92" cy="48" r="6" fill="#28C840"/>
  <text x="120" y="53" font-family="Consolas,Menlo,monospace" font-size="13" fill="#64748B">xero@profile: ~</text>

  <g font-family="Consolas,Menlo,monospace" font-size="18">
    <text x="48" y="98" fill="#38BDF8">xero@profile</text><text x="180" y="98" fill="#CBD5E1">:</text><text x="192" y="98" fill="#A78BFA">~</text><text x="205" y="98" fill="#CBD5E1">$ cat identity.json</text>

    <text x="60" y="137" fill="#64748B">{</text>
    <text x="84" y="169" fill="#7DD3FC">"display"</text><text x="198" y="169" fill="#CBD5E1">:</text><text x="218" y="169" fill="#A7F3D0">"XeroLe1er"</text><text x="343" y="169" fill="#64748B">,</text>
    <text x="84" y="201" fill="#7DD3FC">"github"</text><text x="187" y="201" fill="#CBD5E1">:</text><text x="207" y="201" fill="#A7F3D0">"@XeroDroiD"</text><text x="349" y="201" fill="#64748B">,</text>
    <text x="84" y="233" fill="#7DD3FC">"focus"</text><text x="176" y="233" fill="#CBD5E1">:</text><text x="196" y="233" fill="#A7F3D0">["backend", "infra", "web", "minecraft"]</text><text x="639" y="233" fill="#64748B">,</text>
    <text x="84" y="265" fill="#7DD3FC">"status"</text><text x="187" y="265" fill="#CBD5E1">:</text><text x="207" y="265" fill="#A7F3D0">"building"</text>
    <text x="60" y="295" fill="#64748B">}</text>
    <rect x="91" y="282" width="10" height="18" fill="#00E0A1" filter="url(#g)">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>